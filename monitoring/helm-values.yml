# Helm values para kube-prometheus-stack
# Instalación: helm install monitoring prometheus-community/kube-prometheus-stack -f monitoring/helm-values.yml

prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 10d
    resources:
      requests:
        memory: 400Mi
        cpu: 100m
      limits:
        memory: 800Mi
        cpu: 500m
    additionalScrapeConfigs:
      - job_name: api-backend
        static_configs:
          - targets: ['api-service.default.svc.cluster.local:3000']

grafana:
  enabled: true
  adminPassword: admin
  service:
    type: LoadBalancer
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      kubernetes-cluster:
        gnetId: 6417
        revision: 1
        datasource: Prometheus
      node-exporter:
        gnetId: 1860
        revision: 37
        datasource: Prometheus

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        memory: 100Mi
        cpu: 50m

nodeExporter:
  enabled: true
